<div class="container mt-5">
    <h1>Cadastro</h1>
    <form [formGroup]="customerForm" (ngSubmit)="submit()" #formdir="ngForm">
        <div class="mt-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" formControlName="name" class="form-control" formControlName="name" />
        </div>
        <div class="mt-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" id="email" formControlName="email" class="form-control"formControlName="email"  />
        </div>
        <div class="mt-3">
            <label for="document" class="form-label">Document</label>
            <input type="text" id="document" formControlName="document" class="form-control" formControlName="document" />
        </div>
       
        <div class="d-flex mt-3">
        <button class="btn btn-success w-50 mx-1" type="submit">Cadastrar</button>
        <a class="btn btn-danger w-50 mx-1" [routerLink]="['/']">Voltar</a>
        </div>
    </form>
</div>
