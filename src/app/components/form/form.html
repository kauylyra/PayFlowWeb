<div class="container mt-5">

  <h1 class="payflow-title">{{ isEditMode ? 'Alterar usuário' : 'Cadastro de novo usuário' }}</h1>

  <form
    [formGroup]="customerForm"
    (ngSubmit)="submit()">

    <div class="mt-3">

      <label id="nome"
        for="name"
        class="form-label">
        Nome
      </label>

      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-control">

    </div>

    <div class="mt-3">

      <label
        for="email"
        class="form-label">
        E-mail
      </label>

      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-control">

    </div>

    <div class="mt-3">

      <label
        for="document"
        class="form-label">
        Documento
      </label>

      <input
        type="text"
        id="document"
        formControlName="document"
        class="form-control">

    </div>

    <div class="d-flex mt-4">

      <button
        class="btn btn-success w-10 mx-1"
        type="submit">
        Salvar
      </button>

      <a
        class="btn btn-danger w-10 mx-1"
        [routerLink]="['/']">
        Voltar
      </a>

    </div>

  </form>

</div>
